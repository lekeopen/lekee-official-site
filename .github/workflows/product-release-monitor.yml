name: Product release monitor

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Plan OSS mirror operations without writing objects or release data
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: product-release-monitor
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check stable product releases
        if: github.event_name != 'workflow_dispatch' || inputs.dry_run != true
        run: npm run products:releases:check

      - name: Mirror verified release assets (dry-run)
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run == true
        run: npm run products:releases:mirror:dry-run

      - name: Mirror verified release assets
        if: github.event_name != 'workflow_dispatch' || inputs.dry_run != true
        env:
          ALIYUN_OSS_ACCESS_KEY_ID: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_ID }}
          ALIYUN_OSS_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_SECRET }}
          OSS_ENDPOINT: https://oss-cn-beijing.aliyuncs.com
          OSS_BUCKET: lekeopen-downloads
          OSS_PUBLIC_BASE_URL: https://lekeopen-downloads.oss-cn-beijing.aliyuncs.com
        run: node scripts/product-release-mirror.mjs --execute

      - name: Detect release data changes
        if: github.event_name != 'workflow_dispatch' || inputs.dry_run != true
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- src/products/releases.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify website
        if: (github.event_name != 'workflow_dispatch' || inputs.dry_run != true) && steps.changes.outputs.changed == 'true'
        run: npm run verify

      - name: Commit verified release data
        if: (github.event_name != 'workflow_dispatch' || inputs.dry_run != true) && steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/products/releases.json
          changed_paths="$(git diff --cached --name-only)"
          if [ "$changed_paths" != "src/products/releases.json" ]; then
            echo "Refusing to commit unexpected paths: $changed_paths" >&2
            exit 1
          fi
          git commit -m "chore: update product releases"
          git push origin HEAD:main
