name: Product release monitor

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: product-release-monitor
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check stable product releases
        run: npm run products:releases:check

      - name: Detect release data changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- src/products/releases.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify website
        if: steps.changes.outputs.changed == 'true'
        run: npm run verify

      - name: Commit verified release data
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/products/releases.json
          changed_paths="$(git diff --cached --name-only)"
          if [ "$changed_paths" != "src/products/releases.json" ]; then
            echo "Refusing to commit unexpected paths: $changed_paths" >&2
            exit 1
          fi
          git commit -m "chore: update product releases"
          git push origin HEAD:main
