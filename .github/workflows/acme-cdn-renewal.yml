name: Renew downloads CDN certificate

on:
  schedule:
    - cron: '17 3 1 * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: downloads-cdn-certificate-renewal
  cancel-in-progress: false

jobs:
  renew-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_DNS_API_TOKEN: ${{ secrets.CLOUDFLARE_DNS_API_TOKEN }}
      ALIYUN_CDN_ACCESS_KEY_ID: ${{ secrets.ALIYUN_CDN_ACCESS_KEY_ID }}
      ALIYUN_CDN_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_CDN_ACCESS_KEY_SECRET }}
      ACME_DOMAIN: downloads.lekeopen.com
      ACME_EMAIL: contact@lekeopen.com
      ACME_SH_COMMIT: 3661fd86b6304115e42f43910e6dd452ab9866d6
      DEPLOY_ALI_CDN_DOMAIN: downloads.lekeopen.com
    steps:
      - name: Validate and mask required secrets
        shell: bash
        run: |
          set -euo pipefail
          for value in \
            "$CLOUDFLARE_DNS_API_TOKEN" \
            "$ALIYUN_CDN_ACCESS_KEY_ID" \
            "$ALIYUN_CDN_ACCESS_KEY_SECRET"
          do
            test -n "$value"
            echo "::add-mask::$value"
          done

      - name: Fetch pinned acme.sh
        shell: bash
        run: |
          set -euo pipefail
          git clone \
            --depth 1 \
            --branch 3.1.4 \
            https://github.com/acmesh-official/acme.sh.git \
            "$RUNNER_TEMP/acme.sh"
          actual_commit="$(git -C "$RUNNER_TEMP/acme.sh" rev-parse HEAD)"
          test "$actual_commit" = "$ACME_SH_COMMIT"

      - name: Issue certificate with Cloudflare DNS-01
        shell: bash
        env:
          CF_Token: ${{ env.CLOUDFLARE_DNS_API_TOKEN }}
        run: |
          set -euo pipefail
          acme="$RUNNER_TEMP/acme.sh/acme.sh"
          config="$RUNNER_TEMP/acme-config"
          "$acme" --register-account \
            --home "$RUNNER_TEMP/acme.sh" \
            --config-home "$config" \
            --server letsencrypt \
            --accountemail "$ACME_EMAIL"
          "$acme" --issue \
            --home "$RUNNER_TEMP/acme.sh" \
            --config-home "$config" \
            --server letsencrypt \
            --dns dns_cf \
            --keylength ec-256 \
            -d "$ACME_DOMAIN"

      - name: Deploy certificate to Alibaba Cloud CDN
        shell: bash
        env:
          Ali_Key: ${{ env.ALIYUN_CDN_ACCESS_KEY_ID }}
          Ali_Secret: ${{ env.ALIYUN_CDN_ACCESS_KEY_SECRET }}
        run: |
          set -euo pipefail
          acme="$RUNNER_TEMP/acme.sh/acme.sh"
          config="$RUNNER_TEMP/acme-config"
          "$acme" --deploy \
            --home "$RUNNER_TEMP/acme.sh" \
            --config-home "$config" \
            --server letsencrypt \
            --ecc \
            -d "$ACME_DOMAIN" \
            --deploy-hook ali_cdn
          echo "certificate was deployed to Alibaba Cloud CDN"
